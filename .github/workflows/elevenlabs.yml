name: Tạo giọng đọc ElevenLabs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Số câu tạo lần này (0 = tạo hết). Lần đầu nên để 5 để nghe thử.'
        default: '5'
        required: true
      answer_voice:
        description: 'Voice ID cho bài mẫu (để trống = Sarah)'
        default: ''
        required: false
      question_voice:
        description: 'Voice ID cho câu hỏi giám khảo (để trống = George)'
        default: ''
        required: false
      model:
        description: 'Model'
        default: 'eleven_multilingual_v2'
        required: true
      redo:
        description: 'Tạo lại cả câu đã có (tốn credit lại) - chỉ dùng khi đổi giọng'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: elevenlabs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đếm số ký tự sẽ dùng
        run: python3 tools/elevenlabs_tts.py --dry-run

      - name: Tạo file âm thanh
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ANSWER_VOICE: ${{ inputs.answer_voice }}
          QUESTION_VOICE: ${{ inputs.question_voice }}
          MODEL_ID: ${{ inputs.model }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "Chưa có secret ELEVENLABS_API_KEY"; exit 1; fi
          EXTRA=""
          if [ "${{ inputs.redo }}" = "true" ]; then EXTRA="--redo"; fi
          python3 tools/elevenlabs_tts.py --limit "${{ inputs.limit }}" $EXTRA

      - name: Lưu file vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Không có file mới"; exit 0; fi
          git commit -m "Thêm giọng đọc ElevenLabs"
          git push

      - name: Cập nhật GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages sẽ tự cập nhật"
